<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤘RooooooockGrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <span>🤘RooooooockGrid</span>
      </div>
    </div>

    <div class="game-container">
      <div class="game-info">
        <div
          id="guessesCounter"
          style="font-size: 16px; font-weight: bold; color: #fedd00"
        >
          Palpites: 0/12
        </div>
      </div>

      <div class="grid-container" id="grid"></div>
    </div>

    <!-- Modal para entrada da banda -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <h3 id="modalTitle">Entre o nome da banda</h3>
        <div class="input-container">
          <input
            type="text"
            id="stateInput"
            placeholder="Ex: Paralamas do Sucesso"
            autocomplete="off"
          />
          <button onclick="submitAnswer()">Confirmar</button>
        </div>
        <div class="message" id="modalMessage"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
